name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest
      - name: Clean install smoke
        run: |
          set -euo pipefail
          python -m pip install build
          python -m build
          smoke="${RUNNER_TEMP}/agentcost-venv"
          python -m venv "${smoke}"
          if [[ -e "${smoke}/bin/python" ]]; then
            py="${smoke}/bin/python"
            export PATH="${smoke}/bin:${PATH}"
          elif [[ -e "${smoke}/Scripts/python.exe" ]]; then
            py="${smoke}/Scripts/python.exe"
            export PATH="${smoke}/Scripts:${PATH}"
          else
            echo "could not find the smoke venv interpreter under ${smoke}" >&2
            exit 1
          fi
          "${py}" -m pip install --upgrade pip
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [[ ${#wheels[@]} -ne 1 ]]; then
            echo "expected exactly one wheel in dist/, found ${#wheels[@]}" >&2
            exit 1
          fi
          "${py}" -m pip install "${wheels[0]}"
          trace="$(python -c 'import os, pathlib; print(pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "examples" / "research_agent" / "traces.jsonl")')"
          report="${RUNNER_TEMP}/agentcost-report.json"
          cd "${RUNNER_TEMP}"
          agentcost --help
          agentcost report "${trace}" --compare A B --format json > "${report}"
          "${py}" - "${report}" << 'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          verdict = data.get("verdict")
          if verdict not in {"better", "worse", "no_difference", "inconclusive"}:
              raise SystemExit(f"missing verdict: {verdict!r}")
          arms = data.get("arms")
          if not isinstance(arms, dict) or "A" not in arms or "B" not in arms:
              raise SystemExit(
                  f"expected variants A and B, got {list(arms) if isinstance(arms, dict) else arms!r}"
              )
          print(f"smoke ok: verdict={verdict}")
          PY
      - name: Smoke pipx
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: |
          set -euo pipefail
          python -m pip install pipx
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [[ ${#wheels[@]} -ne 1 ]]; then
            echo "expected exactly one wheel in dist/, found ${#wheels[@]}" >&2
            exit 1
          fi
          export PIPX_HOME="${RUNNER_TEMP}/pipx"
          export PIPX_BIN_DIR="${RUNNER_TEMP}/pipx-bin"
          mkdir -p "${PIPX_BIN_DIR}"
          python -m pipx install --python "$(command -v python)" "${wheels[0]}"
          bin="${PIPX_BIN_DIR}/agentcost"
          if [[ ! -x "${bin}" ]]; then
            python -m pipx environment
            echo "pipx did not install ${bin}" >&2
            exit 1
          fi
          trace="$(python -c 'import os, pathlib; print(pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "examples" / "research_agent" / "traces.jsonl")')"
          report="${RUNNER_TEMP}/agentcost-pipx-report.json"
          cd "${RUNNER_TEMP}"
          "${bin}" --help
          "${bin}" report "${trace}" --compare A B --format json > "${report}"
          python - "${report}" << 'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          verdict = data.get("verdict")
          if verdict not in {"better", "worse", "no_difference", "inconclusive"}:
              raise SystemExit(f"missing verdict: {verdict!r}")
          arms = data.get("arms")
          if not isinstance(arms, dict) or "A" not in arms or "B" not in arms:
              raise SystemExit(
                  f"expected variants A and B, got {list(arms) if isinstance(arms, dict) else arms!r}"
              )
          print(f"pipx smoke ok: verdict={verdict}")
          PY
