# Example only. Copy it into the repository that produces the traces.
# It lives outside .github/workflows so it does not run in the agentcost repo.
name: agentcost

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agentcost
        run: python -m pip install agentcost

      # candidate.jsonl and baseline.jsonl are agentcost traces.
      # They can be the JSONL written by `agentcost import`.
      # An inconclusive verdict exits 0 and prints the reason on stderr.
      # Add --fail-if-inconclusive (it requires --fail-if-worse) to exit 4.
      # A regression still exits 3. Exit 1 is a usage or input error.
      - name: Compare traces
        run: |
          set -euo pipefail
          agentcost report candidate.jsonl baseline.jsonl \
            --compare candidate baseline \
            --fail-if-worse \
            --max-regression 5 \
            --markdown-summary agentcost-summary.md \
            --github-step-summary

      - name: Comment on the pull request
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const path = 'agentcost-summary.md'
            if (!fs.existsSync(path)) {
              core.warning('agentcost did not write a summary')
              return
            }
            const body = fs.readFileSync(path, 'utf8')
            const marker = '<!-- agentcost-ci -->'
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
              return
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            })
